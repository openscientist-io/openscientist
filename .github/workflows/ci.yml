name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Runs on main
# always finish, so every merge commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The lint steps install and run third-party code, so the checkout
          # token must not sit in .git/config for them to read.
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check src/ tests/

      - name: Format check
        run: uv run --locked ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: uv sync --locked

      - name: Type check
        run: uv run --locked mypy src/openscientist/ tests/

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    permissions:
      contents: read
      # Codecov authenticates with a short lived GitHub token instead of a secret.
      id-token: write

    services:
      postgres:
        image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_USER: openscientist
          POSTGRES_PASSWORD: openscientist_dev_password
          POSTGRES_DB: openscientist
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U openscientist -d openscientist"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://openscientist:openscientist_dev_password@localhost:5434/openscientist
      # A test whose system requirement (Pango, Graphviz, Docker Compose) is
      # missing fails here instead of skipping.
      OPENSCIENTIST_REQUIRE_SYSTEM_TESTS: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: uv sync --locked

      # The system packages the images install, WeasyPrint's Pango stack, its
      # fonts and Graphviz, read from Dockerfile.base so the two lists match.
      - name: System packages from Dockerfile.base
        run: |
          packages=$(sed -n '/apt-get install/,/rm -rf/s/^ *\([a-z0-9][a-z0-9.+-]*\) *\\$/\1/p' Dockerfile.base)
          test -n "$packages"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $packages

      - name: Unit & Integration Tests
        # Live third-party APIs are deselected: NCBI rate limits by IP and the
        # shared runner egress makes those tests fail unrelated to the change.
        # The environment comes from the preceding step, so the interpreter is
        # called directly and this step touches no dependencies.
        run: .venv/bin/python -m pytest -m "not network" --cov=src/openscientist --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true

      - name: Upload coverage to Codecov from a fork
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        # A fork run gets neither a secret nor a writable OIDC token, so this
        # upload is unauthenticated and must not fail a contributor's build.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: false
