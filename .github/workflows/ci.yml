name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The lock file pins the exact source hash. A required transitive package
      # is sdist-only, so uv's blanket --no-build mode cannot install this graph.
      - run: uv sync --locked  # NOSONAR

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The lock file pins the exact source hash. A required transitive package
      # is sdist-only, so uv's blanket --no-build mode cannot install this graph.
      - run: uv sync --locked  # NOSONAR

      - name: Type check
        run: uv run mypy src/openscientist/ tests/

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 45

    permissions:
      contents: read
      # Codecov authenticates with a short lived GitHub token instead of a secret.
      id-token: write

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: openscientist
          POSTGRES_PASSWORD: openscientist_dev_password
          POSTGRES_DB: openscientist
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U openscientist -d openscientist"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://openscientist:openscientist_dev_password@localhost:5434/openscientist

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The lock file pins the exact source hash. A required transitive package
      # is sdist-only, so uv's blanket --no-build mode cannot install this graph.
      - run: uv sync --locked  # NOSONAR

      - name: Unit & Integration Tests
        # Live third-party APIs are deselected: NCBI rate limits by IP and the
        # shared runner egress makes those tests fail unrelated to the change.
        # The environment comes from the preceding step, so the interpreter is
        # called directly and this step touches no dependencies.
        run: >-
          .venv/bin/python -m pytest
          -m "not network"
          --cov=src/openscientist
          --cov-report=term-missing
          --cov-report=xml
          --junitxml=pytest-results.xml

      - name: Publish coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true

      - name: Upload coverage to Codecov from a fork
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        # A fork run gets neither a secret nor a writable OIDC token, so this
        # upload is unauthenticated and must not fail a contributor's build.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: false

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: error
          retention-days: 14

  sonarcloud:
    needs: test
    # A pull request from a fork cannot read SONAR_TOKEN.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/sonarcloud.yml
    secrets: inherit
