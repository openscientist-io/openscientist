# RFC section 9 backstop layer. Default-deny path+method allowlist for the
# Docker Engine API. This is the second of two layers in front of the real
# Docker socket -- the validator container (docker/airgap-docker-proxy/validator/)
# sits in front of THIS proxy and does JSON-body inspection for
# POST /containers/create; this layer never parses request bodies, it only
# matches method + URL path. Both layers must independently agree on what
# counts as each route -- see validator.py's module docstring for why.
#
# No env-var toggles (unlike tecnativa/docker-socket-proxy). One deployment,
# one policy -- making this configurable would just be surface area nobody
# needs. Every allowed route below corresponds to a real openscientist call
# in src/openscientist/container_manager.py:
#   POST   /containers/create           -> ContainerManager.spawn (containers.run)
#   POST   /containers/{id}/start       -> (containers.run's implicit start)
#   GET    /containers/{id}/json        -> containers.get
#   GET    /containers/json             -> containers.list (label-filtered cleanup)
#   GET    /containers/{id}/logs        -> container.logs()
#   POST   /containers/{id}/wait        -> containers.run's synchronous wait
#   DELETE /containers/{id}             -> container.remove(force=True)
#   GET    /images/{id}/json            -> images.get
#   GET    /_ping                       -> client.ping()
# Everything else -- exec, networks, volumes, build, commit, secrets, swarm,
# plugins, system, nodes, services, tasks, configs, distribution, grpc,
# session, auth, events, restart/stop/kill -- is denied. In particular note
# there is NO allow rule for /containers/{id}/exec: Docker's exec-create
# endpoint lives under the /containers/ prefix, so a coarser "allow anything
# under /containers" rule (the mistake tecnativa/docker-socket-proxy's
# CONTAINERS=1 toggle makes) would silently let it through. Every allow rule
# here is anchored to an exact suffix, not a prefix.

global
    log stdout format raw daemon info

    # No pidfile: this container runs haproxy as PID 1 in the foreground
    # (standard container pattern); the pidfile directive is only needed
    # for the traditional daemonized-with-init-script deployment shape,
    # and the default writable path (/run) isn't owned by the image's
    # unprivileged haproxy user anyway.
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 1500

    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

backend dockerbackend
    server dockersocket /var/run/docker.sock

frontend dockerfrontend
    # Only the validator container reaches this frontend (see
    # docker-compose.yml -- this service has no network alias on the
    # default network, only on the internal airgap-proxy-backend network).
    bind :2375

    acl path_versioned path,url_dec -m reg -i ^/v[0-9]+\.[0-9]+
    http-request set-var(txn.p) path,url_dec

    # Strip a leading Docker API version prefix (/v1.44/...) before matching,
    # so versioned and unversioned requests are judged identically. Docker
    # API versions are always /v<major>.<minor>/... (no other punctuation).
    http-request set-var(txn.p) path,url_dec,regsub(^/v[0-9]+\.[0-9]+,,) if path_versioned

    http-request allow if METH_POST { var(txn.p) -m str /containers/create }
    http-request allow if METH_POST { var(txn.p) -m reg -i ^/containers/[a-zA-Z0-9_.-]+/start$ }
    http-request allow if METH_POST { var(txn.p) -m reg -i ^/containers/[a-zA-Z0-9_.-]+/wait$ }
    http-request allow if METH_GET  { var(txn.p) -m str /containers/json }
    http-request allow if METH_GET  { var(txn.p) -m reg -i ^/containers/[a-zA-Z0-9_.-]+/json$ }
    http-request allow if METH_GET  { var(txn.p) -m reg -i ^/containers/[a-zA-Z0-9_.-]+/logs$ }
    http-request allow if METH_DELETE { var(txn.p) -m reg -i ^/containers/[a-zA-Z0-9_.-]+$ }
    http-request allow if METH_GET  { var(txn.p) -m reg -i ^/images/[a-zA-Z0-9_.:/-]+/json$ }
    http-request allow if METH_GET  { var(txn.p) -m str /_ping }
    http-request allow if METH_HEAD { var(txn.p) -m str /_ping }

    http-request deny deny_status 403
    default_backend dockerbackend
