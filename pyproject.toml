[project]
name = "openscientist"
version = "0.1.0"
description = "OpenScientist - Scientific Hypothesis Agent for Novel Discovery"
authors = [
    {name = "Justin Reese", email = "justinreese@lbl.gov"}
]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "nicegui>=3.7.1",

    # Core scientific computing
    "pandas>=3.0.0",
    "numpy>=2.2.0,<2.4",

    # File format support
    "python-magic>=0.4.27",  # MIME type detection
    "openpyxl>=3.1.0",       # Excel .xlsx support
    "pyarrow>=14.0.0",       # Parquet support
    "pymupdf>=1.24.0",       # PDF text extraction
    "python-docx>=1.1.0",    # Word document text extraction

    # YAML config (omp models.yml catalog, skill frontmatter)
    "pyyaml>=6.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # API clients
    "requests>=2.31.0",

    # MCP server. Capped below 2, which renamed FastMCP to MCPServer and so
    # breaks openscientist_tools.server on import.
    "mcp[cli]>=1.0.0,<2",

    # Environment & config
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",

    # Authentication (OAuth)
    "authlib>=1.3.0",
    "httpx>=0.27.0",  # Required by authlib for async OAuth

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",  # PostgreSQL async driver
    "alembic>=1.13.0",  # Database migrations

    # REST API
    "slowapi>=0.1.9",  # Rate limiting for FastAPI

    # Cloud providers (for cost tracking and authentication)
    "google-cloud-bigquery>=3.11.0",  # Vertex AI
    "boto3>=1.34.0",  # AWS Bedrock
    "azure-identity>=1.15.0",  # Azure Foundry authentication
    "azure-mgmt-costmanagement>=4.0.0",  # Azure Foundry cost tracking

    # PDF generation (lightweight, pure Python — fallback)
    "fpdf2>=2.7.0",
    "markdown>=3.5.0",

    # PDF generation (WeasyPrint — primary, requires system libs)
    "weasyprint>=62.0,<69",

    # Berkeley Lab Data Lakehouse
    "linkml-store[dremio]>=0.2.0",

    # Container isolation
    "docker>=7.0.0",

    # Claude Agent SDK (required – powers the agent execution path)
    "claude-agent-sdk>=0.1.46",

    # Codex SDK (second agent backend, official OpenAI package). It installs
    # the codex binary its protocol is pinned to (openai-codex-cli-bin).
    "openai-codex>=0.163.0",

    # The LLM proxy terminates the codex Responses websocket with this client.
    "websockets>=14.0",

    # SPARQL queries against remote endpoints
    "SPARQLWrapper>=2.0.0",

    # Progress bars for the PubMed mirror ingest CLI
    "tqdm>=4.67.0",

    # CLI (setup wizard, start, stop)
    "typer>=0.21.1,<0.22",
    "rich>=14.3.2,<15",

    # Sanitizes the model-formatted research question shown on the job page
    "nh3>=0.3.0",
]

[project.scripts]
openscientist = "openscientist.cli.app:main"
openscientist-launcher = "openscientist_launcher.main:main"

[project.optional-dependencies]
# Scientific stack for the executor container, installed from the lock by
# Dockerfile.executor. The web and agent images do not install it.
executor = [
    # Core scientific computing
    "scipy>=1.15.0",
    "scikit-learn>=1.6.0",

    # Statistics
    "statsmodels>=0.14.0",

    # Domain-specific
    "networkx>=3.0",

    # Single-cell genomics
    "scanpy>=1.12.0",
    "anndata>=0.12.0",
    "h5py>=3.10.0",

    # Bioinformatics
    "biopython>=1.84",

    # Dimensionality reduction and clustering
    "umap-learn>=0.5.0",
    "leidenalg>=0.10.0",
    "python-igraph>=0.11.0",

    # Statistical tests (effect sizes, ANOVA, mixed models)
    "pingouin>=0.5.0",

    # DataFrames for large datasets
    "polars>=1.0.0",

    # Interactive visualization
    "plotly>=5.0.0",

    # Differential expression analysis
    "pydeseq2>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.flake8-bugbear]
# Typer's documented way to declare options in a command's signature.
extend-immutable-calls = ["typer.Option"]

[tool.ruff.lint.per-file-ignores]
"src/openscientist/database/migrations/versions/*" = ["E402"]  # Alembic auto-generated imports after docstrings

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests (require Docker and executor image)",
    "network: marks tests that call a live third-party API (deselected in CI, which shares egress IPs and gets rate limited)",
    "requires_weasyprint: renders with WeasyPrint, which needs the Pango system libraries (skipped without them, failed instead when OPENSCIENTIST_REQUIRE_SYSTEM_TESTS is set)",
    "requires_graphviz: draws report diagrams with the Graphviz dot command (skipped without it, failed instead when OPENSCIENTIST_REQUIRE_SYSTEM_TESTS is set)",
    "requires_docker_compose: runs the real docker compose (skipped without it, failed instead when OPENSCIENTIST_REQUIRE_SYSTEM_TESTS is set)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-requests>=2.31.0",
    "pandas-stubs>=3.0.0",
    "types-seaborn>=0.13.0",
    "types-openpyxl>=3.1.0",
    "types-fpdf2>=2.7.0",
    "types-docker>=7.0.0",
    "types-PyYAML>=6.0",
    "pre-commit>=3.5.0",
    "testcontainers[postgres]>=4.0.0",
    "cairosvg>=2.8.2",
]
